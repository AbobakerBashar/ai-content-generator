<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" /> <stop offset="100%" stop-color="#a78bfa" /> </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(5, 5)" filter="url(#glow)">
    <polygon points="20,0 40,10 40,30 20,40 0,30 0,10" fill="none" stroke="url(#icon-grad-dark)" stroke-width="3" />
    <path d="M22,8 L12,24 L20,24 L18,36 L28,20 L20,20 Z" fill="url(#icon-grad-dark)" />
  </g>
  
  <text x="55" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#f8fafc">SPARK</text>
  <text x="140" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#a78bfa">GEN</text>
</svg>
